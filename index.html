<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hastane Acil Öncelik Sistemi</title>
  <meta name="description" content="Hastane Acil Öncelik Sistemi — MaxHeap tabanlı triyaj kuyruğu." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏥</text></svg>" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #0f172a;
      --navy-mid: #1e293b;
      --navy-light: #334155;
      --accent: #38bdf8;
      --accent-dark: #0284c7;
      --red: #ef4444;
      --red-dark: #b91c1c;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #334155;
      --green: #22c55e;
      --yellow: #eab308;
      --orange: #f97316;
      --radius: 10px;
    }

    body {
      display: flex;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--navy);
      color: var(--text);
    }

    /* PANELS */
    .panel { padding: 28px 24px; }
    .panel--left {
      width: 320px;
      min-width: 280px;
      background: var(--navy-mid);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .panel--right {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 24px;
      overflow-y: auto;
    }
    .panel__title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: .03em;
    }

    /* FORM */
    form { display: flex; flex-direction: column; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: .85rem; color: var(--text-muted); font-weight: 500; }
    label strong { color: var(--accent); font-size: 1rem; }
    input[type="text"],
    input[type="number"] {
      background: var(--navy-light);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px 12px;
      color: var(--text);
      font-size: .95rem;
      outline: none;
      transition: border-color .15s;
    }
    input[type="text"]:focus,
    input[type="number"]:focus { border-color: var(--accent); }
    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .field__error { font-size: .78rem; color: var(--red); min-height: 16px; }

    /* BUTTONS */
    .btn {
      border: none;
      border-radius: var(--radius);
      padding: 11px 20px;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, transform .08s, opacity .15s;
    }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
    .btn--add { background: var(--accent); color: var(--navy); }
    .btn--add:hover:not(:disabled) { background: var(--accent-dark); color: #fff; }
    .btn--treat { background: var(--red); color: #fff; }
    .btn--treat:hover:not(:disabled) { background: var(--red-dark); }

    /* RIGHT TOP */
    .right-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .app-title { font-size: 1.4rem; font-weight: 800; }

    /* SECTION TITLES */
    .section-title {
      font-size: .95rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 12px;
    }

    /* TABLE */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th {
      text-align: left;
      padding: 8px 12px;
      background: var(--navy-mid);
      color: var(--text-muted);
      font-size: .78rem;
      text-transform: uppercase;
      letter-spacing: .06em;
      border-bottom: 1px solid var(--border);
    }
    td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
    tbody tr:hover { background: var(--navy-mid); }
    tbody tr:first-child td { background: rgba(239,68,68,.08); }

    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: .8rem;
      font-weight: 700;
      color: #fff;
    }
    .badge--low    { background: #16a34a; }
    .badge--mid    { background: #ca8a04; }
    .badge--high   { background: #ea580c; }
    .badge--crit   { background: #dc2626; }

    .rank-1 { font-weight: 800; color: var(--red); }
    .empty-msg { color: var(--text-muted); font-size: .9rem; padding: 16px 0; }

    /* HISTORY */
    .history-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .history-item {
      background: var(--navy-mid);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: .88rem;
      display: flex;
      flex-direction: column;
      animation: slideIn .25s ease;
    }
    .history-item__row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .history-item__name  { font-weight: 700; }
    .history-item__meta  { color: var(--text-muted); font-size: .8rem; margin-top: 3px; }
    .history-item__right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .history-item__time  { color: var(--text-muted); font-size: .78rem; white-space: nowrap; }
    .history-empty       { color: var(--text-muted); font-size: .88rem; }

    /* RE-QUEUE BUTTON + FORM */
    .btn-requeue {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: .78rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    .btn-requeue:hover { border-color: var(--accent); color: var(--accent); }
    .requeue-form {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .requeue-form__label { font-size: .82rem; color: var(--text-muted); white-space: nowrap; }
    .requeue-slider { flex: 1; min-width: 80px; accent-color: var(--accent); cursor: pointer; }
    .btn-cancel-requeue {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: .82rem;
      cursor: pointer;
      padding: 4px 0;
    }
    .btn-cancel-requeue:hover { color: var(--text); }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: var(--navy-light);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 20px;
      font-size: .9rem;
      font-weight: 500;
      color: var(--text);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity .25s, transform .25s;
      pointer-events: none;
      max-width: 340px;
      z-index: 100;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 700px) {
      body { flex-direction: column; }
      .panel--left { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
    }

    /* TREATMENT ZONE */
    .treatment-zone {
      background: rgba(56,189,248,.06);
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      padding: 16px 20px;
    }
    .treatment-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .treatment-card__name { font-size: 1rem; font-weight: 700; }
    .treatment-card__meta { font-size: .85rem; color: var(--text-muted); margin-top: 4px; }
    .treatment-card__right { display: flex; align-items: center; gap: 12px; }
    .dept-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: .78rem;
      font-weight: 700;
      background: rgba(56,189,248,.12);
      color: var(--accent);
      border: 1px solid rgba(56,189,248,.28);
    }
    .btn--discharge { background: var(--green); color: #fff; }
    .btn--discharge:hover:not(:disabled) { background: #16a34a; }

    /* STATS */
    .stats-section {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .stat-card {
      flex: 1;
      min-width: 90px;
      background: var(--navy-mid);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      text-align: center;
    }
    .stat-value {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 4px;
    }
    .stat-label {
      font-size: .74rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    /* FILTER BAR */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .filter-input {
      flex: 1;
      min-width: 140px;
      background: var(--navy-light);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      color: var(--text);
      font-size: .88rem;
      outline: none;
      transition: border-color .15s;
    }
    .filter-input:focus { border-color: var(--accent); }
    .filter-sev { display: flex; align-items: center; gap: 6px; }
    .filter-sev-label { font-size: .82rem; color: var(--text-muted); white-space: nowrap; }
    .filter-num {
      width: 52px;
      background: var(--navy-light);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 8px;
      color: var(--text);
      font-size: .88rem;
      outline: none;
      text-align: center;
      transition: border-color .15s;
    }
    .filter-num:focus { border-color: var(--accent); }
    .btn-link {
      background: none;
      border: none;
      color: var(--accent);
      font-size: .82rem;
      cursor: pointer;
      padding: 4px 2px;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    /* STATUS BADGES */
    .status-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: .75rem;
      font-weight: 600;
    }
    .status--waiting    { background: rgba(148,163,184,.14); color: var(--text-muted); }
    .status--discharged { background: rgba(34,197,94,.14);   color: var(--green); }
  </style>
</head>
<body>

  <!-- LEFT PANEL -->
  <aside class="panel panel--left">
    <h2 class="panel__title">Hasta Ekle</h2>
    <form id="patientForm" novalidate>
      <div class="field">
        <label for="name">Hasta Adı</label>
        <input id="name" type="text" placeholder="Ad Soyad" autocomplete="off" />
        <span class="field__error" id="nameError"></span>
      </div>
      <div class="field">
        <label for="age">Yaş</label>
        <input id="age" type="number" min="1" max="120" placeholder="1 – 120" />
        <span class="field__error" id="ageError"></span>
      </div>
      <div class="field">
        <label for="severity">Aciliyet: <strong id="severityLabel">5</strong> / 10</label>
        <input id="severity" type="range" min="1" max="10" value="5" />
      </div>
      <button type="submit" class="btn btn--add">Hasta Ekle</button>
    </form>
  </aside>

  <!-- RIGHT PANEL -->
  <main class="panel panel--right">
    <div class="right-top">
      <h1 class="app-title">Acil Öncelik Kuyruğu</h1>
      <button id="treatBtn" class="btn btn--treat">Sıradaki Hastayı Tedavi Et</button>
    </div>

    <!-- STATS -->
    <section class="stats-section">
      <div class="stat-card">
        <div class="stat-value" id="statTotal">0</div>
        <div class="stat-label">Bugün Eklenen</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statWaiting">0</div>
        <div class="stat-label">Şu An Bekliyor</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statAvgSev">—</div>
        <div class="stat-label">Ort. Aciliyet</div>
      </div>
    </section>

    <!-- TREATMENT ZONE (visible only when inTreatment !== null) -->
    <section id="treatmentZone" class="treatment-zone" hidden>
      <h2 class="section-title" style="margin-bottom:12px">Şu An Tedavide</h2>
      <div class="treatment-card">
        <div class="treatment-card__info">
          <div class="treatment-card__name" id="treatName"></div>
          <div class="treatment-card__meta" id="treatMeta"></div>
        </div>
        <div class="treatment-card__right">
          <span class="dept-badge" id="treatDept"></span>
          <button id="dischargeBtn" class="btn btn--discharge">Taburcu Et</button>
        </div>
      </div>
    </section>

    <section class="queue-section">
      <h2 class="section-title" style="margin-bottom:10px">Mevcut Kuyruk</h2>
      <div class="filter-bar">
        <input id="filterName" type="text" placeholder="İsme göre ara…" class="filter-input" autocomplete="off" />
        <div class="filter-sev">
          <span class="filter-sev-label">Aciliyet:</span>
          <input id="filterMinSev" type="number" min="1" max="10" placeholder="Min" class="filter-num" />
          <span class="filter-sev-label">–</span>
          <input id="filterMaxSev" type="number" min="1" max="10" placeholder="Max" class="filter-num" />
        </div>
        <button id="clearFilter" class="btn-link" style="display:none">Filtreyi Temizle</button>
      </div>
      <div class="table-wrap">
        <table id="queueTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Ad</th>
              <th>Yaş</th>
              <th>Aciliyet</th>
              <th>Durum</th>
            </tr>
          </thead>
          <tbody id="queueBody"></tbody>
        </table>
        <p id="emptyMsg" class="empty-msg">Kuyrukta hasta bulunmuyor.</p>
      </div>
    </section>

    <section class="history-section">
      <h2 class="section-title">Tedavi Geçmişi</h2>
      <ul id="historyList" class="history-list">
        <li class="history-empty">Henüz tedavi edilen hasta yok.</li>
      </ul>
    </section>
  </main>

  <!-- TOAST -->
  <div id="toast" class="toast" aria-live="polite"></div>

  <script>
    class Patient {
      constructor(name, age, severity, arrivalIndex) {
        this.name = name;
        this.age = age;
        this.severity = severity;
        this.arrivalIndex = arrivalIndex;
      }
    }

    class MaxHeap {
      constructor() {
        this._heap = [];
      }

      size() { return this._heap.length; }
      peek() { return this._heap[0] ?? null; }

      _compare(a, b) {
        if (b.severity !== a.severity) return b.severity - a.severity;
        return a.arrivalIndex - b.arrivalIndex;
      }

      _higher(i, j) {
        return this._compare(this._heap[i], this._heap[j]) < 0;
      }

      _swap(i, j) {
        [this._heap[i], this._heap[j]] = [this._heap[j], this._heap[i]];
      }

      _siftUp(i) {
        while (i > 0) {
          const parent = Math.floor((i - 1) / 2);
          if (this._higher(i, parent)) {
            this._swap(i, parent);
            i = parent;
          } else break;
        }
      }

      _siftDown(i) {
        const n = this._heap.length;
        while (true) {
          let top = i;
          const l = 2 * i + 1, r = 2 * i + 2;
          if (l < n && this._higher(l, top)) top = l;
          if (r < n && this._higher(r, top)) top = r;
          if (top === i) break;
          this._swap(i, top);
          i = top;
        }
      }

      insert(patient) {
        this._heap.push(patient);
        this._siftUp(this._heap.length - 1);
      }

      extractMax() {
        if (this._heap.length === 0) return null;
        this._swap(0, this._heap.length - 1);
        const max = this._heap.pop();
        this._siftDown(0);
        return max;
      }

      toSortedArray() {
        const copy = new MaxHeap();
        copy._heap = [...this._heap];
        const result = [];
        while (copy.size() > 0) result.push(copy.extractMax());
        return result;
      }
    }

    const DEPARTMENTS = ['Acil', 'Yoğun Bakım', 'Cerrahi', 'Kardiyoloji'];

    class HospitalQueue {
      constructor() {
        this._heap = new MaxHeap();
        this._arrivalCounter = 0;
        this.totalAddedToday = 0;
        this.inTreatment = null; // { patient, department, startedAt }
        this.treatmentHistory = [];
      }

      addPatient(name, age, severity) {
        const patient = new Patient(name, age, severity, this._arrivalCounter++);
        this._heap.insert(patient);
        this.totalAddedToday++;
      }

      treatNext() {
        if (this.inTreatment) return null;
        const patient = this._heap.extractMax();
        if (!patient) return null;
        const department = DEPARTMENTS[Math.floor(Math.random() * DEPARTMENTS.length)];
        this.inTreatment = { patient, department, startedAt: new Date() };
        return this.inTreatment;
      }

      discharge() {
        if (!this.inTreatment) return null;
        const record = {
          patient: this.inTreatment.patient,
          department: this.inTreatment.department,
          treatedAt: this.inTreatment.startedAt,
          dischargedAt: new Date(),
        };
        this.treatmentHistory.unshift(record);
        this.inTreatment = null;
        return record;
      }

      showQueue() {
        return this._heap.toSortedArray();
      }

      size() {
        return this._heap.size();
      }
    }

    const queue = new HospitalQueue();

    const samplePatients = [
      { name: 'Fatma Yılmaz',  age: 67, severity: 9  },
      { name: 'Mehmet Demir',  age: 34, severity: 6  },
      { name: 'Ayşe Kaya',     age: 52, severity: 10 },
      { name: 'Hüseyin Çelik', age: 78, severity: 4  },
      { name: 'Zeynep Kaplan', age: 45, severity: 7  },
    ];
    samplePatients.forEach(p => queue.addPatient(p.name, p.age, p.severity));

    function severityBadge(s) {
      let cls = 'badge--low';
      if (s >= 9) cls = 'badge--crit';
      else if (s >= 7) cls = 'badge--high';
      else if (s >= 4) cls = 'badge--mid';
      return `<span class="badge ${cls}">${s}</span>`;
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    let _toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
    }

    function renderStats(waiting) {
      document.getElementById('statTotal').textContent = queue.totalAddedToday;
      document.getElementById('statWaiting').textContent = queue.size();
      document.getElementById('statAvgSev').textContent = waiting.length
        ? (waiting.reduce((s, p) => s + p.severity, 0) / waiting.length).toFixed(1)
        : '—';
    }

    function renderInTreatment() {
      const zone = document.getElementById('treatmentZone');
      const it = queue.inTreatment;
      if (!it) { zone.hidden = true; return; }
      zone.hidden = false;
      document.getElementById('treatName').textContent = it.patient.name;
      document.getElementById('treatMeta').innerHTML =
        `Yaş ${it.patient.age} &nbsp;|&nbsp; ${severityBadge(it.patient.severity)}`;
      document.getElementById('treatDept').textContent = it.department;
    }

    function getFilter() {
      const name = (document.getElementById('filterName')?.value ?? '').trim().toLowerCase();
      const minRaw = document.getElementById('filterMinSev')?.value;
      const maxRaw = document.getElementById('filterMaxSev')?.value;
      return {
        name,
        minSev: minRaw ? parseInt(minRaw, 10) : null,
        maxSev: maxRaw ? parseInt(maxRaw, 10) : null,
      };
    }

    function applyFilter(patients) {
      const { name, minSev, maxSev } = getFilter();
      return patients.filter(p => {
        if (name && !p.name.toLowerCase().includes(name)) return false;
        if (minSev !== null && p.severity < minSev) return false;
        if (maxSev !== null && p.severity > maxSev) return false;
        return true;
      });
    }

    function renderQueue() {
      const all = queue.showQueue();
      const { name, minSev, maxSev } = getFilter();
      const hasFilter = !!(name || minSev !== null || maxSev !== null);
      const clearBtn = document.getElementById('clearFilter');
      if (clearBtn) clearBtn.style.display = hasFilter ? 'inline' : 'none';

      const patients = applyFilter(all);
      const tbody = document.getElementById('queueBody');
      const emptyMsg = document.getElementById('emptyMsg');
      const treatBtn = document.getElementById('treatBtn');

      treatBtn.disabled = all.length === 0 || queue.inTreatment !== null;
      emptyMsg.style.display = patients.length === 0 ? 'block' : 'none';
      emptyMsg.textContent = hasFilter && all.length > 0
        ? 'Sonuç bulunamadı.'
        : 'Kuyrukta hasta bulunmuyor.';

      tbody.innerHTML = patients.map((p, i) => `
        <tr>
          <td class="${i === 0 && !hasFilter ? 'rank-1' : ''}">${i + 1}</td>
          <td>${escHtml(p.name)}</td>
          <td>${p.age}</td>
          <td>${severityBadge(p.severity)}</td>
          <td><span class="status-badge status--waiting">Bekliyor</span></td>
        </tr>
      `).join('');

      renderStats(all);
    }

    function renderHistory() {
      const list = document.getElementById('historyList');
      if (queue.treatmentHistory.length === 0) {
        list.innerHTML = '<li class="history-empty">Henüz tedavi edilen hasta yok.</li>';
        return;
      }
      list.innerHTML = queue.treatmentHistory.map(({ patient: p, department, dischargedAt }) => `
        <li class="history-item">
          <div class="history-item__row">
            <div>
              <div class="history-item__name">${escHtml(p.name)}</div>
              <div class="history-item__meta">
                Yaş ${p.age} &nbsp;|&nbsp; ${severityBadge(p.severity)}
                &nbsp;|&nbsp; <span class="dept-badge">${escHtml(department)}</span>
              </div>
            </div>
            <div class="history-item__right">
              <span class="status-badge status--discharged">Taburcu</span>
              <div class="history-item__time">${dischargedAt.toLocaleTimeString('tr-TR')}</div>
              <button class="btn-requeue"
                data-name="${escHtml(p.name)}"
                data-age="${p.age}"
                data-sev="${p.severity}">Yeniden Kuyruğa Al</button>
            </div>
          </div>
          <div class="requeue-form" hidden>
            <label class="requeue-form__label">
              Yeni Aciliyet: <strong class="requeue-sev-label">${Math.min(p.severity + 1, 10)}</strong> / 10
            </label>
            <input type="range" class="requeue-slider" min="1" max="10"
              value="${Math.min(p.severity + 1, 10)}" />
            <button class="btn btn--add btn-requeue-confirm"
              style="padding:7px 14px;font-size:.85rem">Ekle</button>
            <button class="btn-cancel-requeue">İptal</button>
          </div>
        </li>
      `).join('');
    }

    document.getElementById('severity').addEventListener('input', e => {
      document.getElementById('severityLabel').textContent = e.target.value;
    });

    document.getElementById('patientForm').addEventListener('submit', e => {
      e.preventDefault();
      const nameEl     = document.getElementById('name');
      const ageEl      = document.getElementById('age');
      const severityEl = document.getElementById('severity');
      const nameErr    = document.getElementById('nameError');
      const ageErr     = document.getElementById('ageError');

      let valid = true;
      nameErr.textContent = '';
      ageErr.textContent  = '';

      const name = nameEl.value.trim();
      const age  = parseInt(ageEl.value, 10);

      if (!name) { nameErr.textContent = 'Ad alanı zorunludur.'; valid = false; }
      if (!ageEl.value || isNaN(age) || age < 1 || age > 120) {
        ageErr.textContent = 'Yaş 1 ile 120 arasında olmalıdır.'; valid = false;
      }
      if (!valid) return;

      const severity = parseInt(severityEl.value, 10);
      queue.addPatient(name, age, severity);
      renderQueue();
      showToast(`Eklendi: ${name} (aciliyet ${severity})`);

      nameEl.value = '';
      ageEl.value  = '';
      severityEl.value = 5;
      document.getElementById('severityLabel').textContent = '5';
    });

    document.getElementById('treatBtn').addEventListener('click', () => {
      const result = queue.treatNext();
      if (!result) return;
      renderInTreatment();
      renderQueue();
      showToast(`Tedaviye alındı: ${result.patient.name} → ${result.department}`);
    });

    document.getElementById('dischargeBtn').addEventListener('click', () => {
      queue.discharge();
      renderInTreatment();
      renderQueue();
      renderHistory();
      showToast('Hasta taburcu edildi.');
    });

    document.getElementById('historyList').addEventListener('click', e => {
      const reqBtn = e.target.closest('.btn-requeue');
      if (reqBtn) {
        const item = reqBtn.closest('.history-item');
        item.querySelector('.requeue-form').hidden = false;
        reqBtn.style.display = 'none';
        return;
      }
      const cancelBtn = e.target.closest('.btn-cancel-requeue');
      if (cancelBtn) {
        const item = cancelBtn.closest('.history-item');
        item.querySelector('.requeue-form').hidden = true;
        item.querySelector('.btn-requeue').style.display = '';
        return;
      }
      const confirmBtn = e.target.closest('.btn-requeue-confirm');
      if (confirmBtn) {
        const item = confirmBtn.closest('.history-item');
        const slider = item.querySelector('.requeue-slider');
        const reqBtn = item.querySelector('.btn-requeue');
        const _t = document.createElement('textarea');
        _t.innerHTML = reqBtn.dataset.name;
        const name = _t.value;
        const age = parseInt(reqBtn.dataset.age, 10);
        const newSev = parseInt(slider.value, 10);
        queue.addPatient(name, age, newSev);
        item.querySelector('.requeue-form').hidden = true;
        reqBtn.style.display = '';
        renderQueue();
        renderHistory();
        showToast(`${name} yeniden kuyruğa alındı (aciliyet ${newSev})`);
      }
    });

    document.getElementById('historyList').addEventListener('input', e => {
      if (e.target.classList.contains('requeue-slider')) {
        const item = e.target.closest('.history-item');
        item.querySelector('.requeue-sev-label').textContent = e.target.value;
      }
    });

    ['filterName', 'filterMinSev', 'filterMaxSev'].forEach(id => {
      document.getElementById(id)?.addEventListener('input', renderQueue);
    });

    document.getElementById('clearFilter')?.addEventListener('click', () => {
      document.getElementById('filterName').value = '';
      document.getElementById('filterMinSev').value = '';
      document.getElementById('filterMaxSev').value = '';
      renderQueue();
    });

    renderQueue();
    renderHistory();
    renderInTreatment();
  </script>
</body>
</html>
